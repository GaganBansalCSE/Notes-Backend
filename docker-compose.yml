version: '3.9'
services:
  db:
    image: postgres:16
    container_name: notes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notes_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    ports:
      - '3000:3000'
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  pgdata:
